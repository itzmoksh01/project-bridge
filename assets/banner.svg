<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Project Bridge</title>
  <desc id="desc">A polished dark gradient banner illustrating a safe bridge between two AI coding agents and one protected project workspace.</desc>
  <defs>
